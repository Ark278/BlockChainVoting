[package]
name = "voting_election"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = { version = "1.4", features = ["staking"] }
cosmwasm-storage = "1.4"
cosmwasm-schema = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "0.8"
thiserror = "1.0"
bincode = "1.3"
cw-utils = "1.0"
cw-storage-plus = "1.0"
cw2 = "1.0"


[dev-dependencies]
cosmwasm-schema = "1.4"
cosmwasm-storage = "1.4"
cosmwasm-std = { version = "1.4", features = ["staking"] }
proptest = "1.0"
